name: Export OpenAPI Schema

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'md2cf/rest_api.py'
      - 'md2cf/converter.py'
      - 'md2cf/api/confluence.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'md2cf/rest_api.py'

jobs:
  export-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[rest]"

      - name: Export OpenAPI schema
        run: |
          python scripts/export-openapi.py openapi.json

      - name: Validate OpenAPI schema
        uses: char0n/swagger-editor-validate@v1
        with:
          definition-file: openapi.json

      - name: Check for changes
        id: changes
        run: |
          git diff --exit-code openapi.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated schema
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add openapi.json
          git commit -m "chore: update OpenAPI schema [skip ci]"
          git push

      - name: Upload schema as artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: openapi.json
          retention-days: 30

      - name: Comment PR with schema changes
        if: github.event_name == 'pull_request' && steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🔄 OpenAPI schema has been updated. Review changes in `openapi.json`'
            })
