services:
  # Production API server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: md2cf:latest
    container_name: md2cf-api
    command: api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - WORKERS=4
      - LOG_LEVEL=info
      # Ziel für den JIRA-Proxy (/jira/proxy/...) und erlaubte Browser-Origins
      - JIRA_URL=${JIRA_URL:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - CORS_ALLOW_ORIGIN_REGEX=${CORS_ALLOW_ORIGIN_REGEX:-}
    healthcheck:
      # Image has no curl/wget; use Python (fails on non-2xx and connection errors)
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    profiles:
      - production

  # Development API server with hot-reload
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: md2cf:latest
    container_name: md2cf-api-dev
    command: api --log-level debug
    ports:
      - "8000:8000"
      - "5678:5678"  # Debugger port
    volumes:
      - ./md2cf:/app/md2cf
      - ./examples:/app/examples
      - ./scripts:/app/scripts
    environment:
      - PORT=8000
      - WORKERS=2
      - LOG_LEVEL=debug
      - PYTHONUNBUFFERED=1
    profiles:
      - dev

  # OpenAPI watcher
  watcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: md2cf:latest
    container_name: md2cf-watcher
    volumes:
      - ./md2cf:/app/md2cf
      - ./scripts:/app/scripts
      - ./:/app/output
    command: python scripts/watch-and-export.py
    # profiles:
    #   - dev

networks:
  default:
    name: md2cf-network
