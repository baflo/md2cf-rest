version: '3.8'

services:
  # Production API server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: md2cf:latest
    container_name: md2cf-api
    command: api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - WORKERS=4
      - LOG_LEVEL=info
      # Ziel für den JIRA-Proxy (/jira/proxy/...) und erlaubte Browser-Origins
      - JIRA_URL=${JIRA_URL:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - CORS_ALLOW_ORIGIN_REGEX=${CORS_ALLOW_ORIGIN_REGEX:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    profiles:
      - production

  # Development API server with hot-reload
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: md2cf:latest
    container_name: md2cf-api-dev
    command: api --log-level debug
    ports:
      - "8000:8000"
      - "5678:5678"  # Debugger port
    volumes:
      - ./md2cf:/app/md2cf
      - ./examples:/app/examples
      - ./scripts:/app/scripts
    environment:
      - PORT=8000
      - WORKERS=2
      - LOG_LEVEL=debug
      - PYTHONUNBUFFERED=1
    profiles:
      - dev

  # OpenAPI watcher
  watcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: md2cf:latest
    container_name: md2cf-watcher
    volumes:
      - ./md2cf:/app/md2cf
      - ./scripts:/app/scripts
      - ./:/app/output
    command: python scripts/watch-and-export.py
    # profiles:
    #   - dev

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: md2cf-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    profiles:
      - production

networks:
  default:
    name: md2cf-network
